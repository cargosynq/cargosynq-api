info:
  name: Create Actions
  type: http
  seq: 3

http:
  method: POST
  url: "{{followupendpoint}}/orders_actions"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "organizationsid": {{organizationId}},
        "ordersid": {{orderId}},
        "entitytype": "orders",
        "entityid": {{orderId}},
        "actiontype": "patch",
        "title": "Update order status",
        "summary": "Mark the order as completed",
        "proposedchanges": {
          "followupstatus": "COMPLETED"
        },
        "currentstate": {
          "followupstatus": "ACTIVE"
        },
        "status": "CREATED"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /orders_actions
  Defined by the cq-backend Follow Up/Orders module.
