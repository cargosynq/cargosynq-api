info:
  name: Update Actions
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{followupendpoint}}/orders_actions/{{orderActionId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "title": "Updated action title",
        "proposedchanges": {
          "followupstatus": "COMPLETED"
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /orders_actions/{id}
  Defined by the cq-backend Follow Up/Orders module.
