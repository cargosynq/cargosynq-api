info:
  name: Update Orders
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{followupEndpoint}}/orders/{{orderId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "followupstatus": "COMPLETED",
        "actualreadiness": "2026-11-30"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /orders/{id}
  Defined by the cq-backend Follow Up/Orders module.
