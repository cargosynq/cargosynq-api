info:
  name: Update Units
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{followupEndpoint}}/orders_units/{{orderUnitId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "status": "READY",
        "weight": 520
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /orders_units/{id}
  Defined by the cq-backend Follow Up/Orders module.
