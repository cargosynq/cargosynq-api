info:
  name: Create Branches
  type: http
  seq: 3

http:
  method: POST
  url: "{{followupEndpoint}}/orders_branches"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "ordersid": {{orderId}},
        "branchesid": {{branchId}}
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /orders_branches
  Defined by the cq-backend Follow Up/Orders module.
