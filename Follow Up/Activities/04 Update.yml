info:
  name: Update Activities
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{followupendpoint}}/orders_activities/{{orderActivityId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "summary": "Updated activity summary"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /orders_activities/{id}
  Defined by the cq-backend Follow Up/Orders module.
