info:
  name: Create References
  type: http
  seq: 3

http:
  method: POST
  url: "{{followupendpoint}}/orders_references"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "ordersid": {{orderId}},
        "text": "REF-12345",
        "type": "CUSTOMER_REFERENCE"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /orders_references
  Defined by the cq-backend Follow Up/Orders module.
