info:
  name: Update Line Items
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{followupendpoint}}/lineitems/{{lineItemId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "quantity": 150,
        "unitcost": 24
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /lineitems/{id}
  Defined by the cq-backend Follow Up/Orders module.
