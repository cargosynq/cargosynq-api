info:
  name: Create Features
  type: http
  seq: 3

http:
  method: POST
  url: "{{followupEndpoint}}/orders_features"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "ordersid": {{orderId}},
        "organizationsid": {{organizationId}},
        "featuretype": "AUTO_FOLLOWUP",
        "enabled": true,
        "configuration": {
          "cadenceDays": 3
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /orders_features
  Defined by the cq-backend Follow Up/Orders module.
