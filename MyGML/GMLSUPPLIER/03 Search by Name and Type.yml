info:
  name: Search GMLSUPPLIER by Name and Type
  type: http
  seq: 3

http:
  method: GET
  url: '{{mygmlGmlsupplierEndpoint}}/?q={"su_peri":"{{gmlsupplierName}}","su_supplier_trader":"{{gmlsupplierTraderType}}"}&limit=25'
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        const searchTerm = String(bru.getEnvVar("gmlsupplierName") || "").trim();
        const supplierType = String(
          bru.getEnvVar("gmlsupplierTraderType") || ""
        ).trim();

        if (!searchTerm) {
          throw new Error("gmlsupplierName must not be empty");
        }
        if (!["Supplier", "Trader"].includes(supplierType)) {
          throw new Error(
            "gmlsupplierTraderType must be either Supplier or Trader"
          );
        }

    - type: after-response
      code: |-
        const body = res.getBody();
        const searchTerm = bru.getEnvVar("gmlsupplierName").toLowerCase();
        const supplierType = bru.getEnvVar("gmlsupplierTraderType");

        if (!body || !Array.isArray(body.items)) {
          throw new Error("GMLSUPPLIER search did not return an ORDS collection");
        }

        const mismatch = body.items.find(
          (supplier) =>
            String(supplier.su_peri || "").trim().toLowerCase() !== searchTerm.trim() ||
            supplier.su_supplier_trader !== supplierType
        );
        if (mismatch) {
          throw new Error(
            `GMLSUPPLIER returned a non-matching record: ${mismatch.su_peri}`
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Searches for an exact su_peri and su_supplier_trader match in one call.
  Set gmlsupplierName to the exact name and gmlsupplierTraderType to either
  Supplier or Trader. Both conditions must match.
