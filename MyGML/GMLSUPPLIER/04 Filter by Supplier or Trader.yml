info:
  name: Filter GMLSUPPLIER by Supplier or Trader
  type: http
  seq: 4

http:
  method: GET
  url: '{{mygmlGmlsupplierEndpoint}}/?q={"su_supplier_trader":"{{gmlsupplierTraderType}}"}&limit=25'
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const expectedType = bru.getEnvVar("gmlsupplierTraderType");
        if (!body || !Array.isArray(body.items)) {
          throw new Error("GMLSUPPLIER filter did not return an ORDS collection");
        }
        const mismatch = body.items.find(
          (supplier) => supplier.su_supplier_trader !== expectedType
        );
        if (mismatch) {
          throw new Error(
            `Expected ${expectedType}, received ${mismatch.su_supplier_trader}`
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Filters on the su_supplier_trader attribute.
  Set gmlsupplierTraderType to either Supplier or Trader.
