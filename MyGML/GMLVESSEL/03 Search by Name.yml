info:
  name: Search GMLVESSEL by Name
  type: http
  seq: 3

http:
  method: GET
  url: '{{mygmlGmlvesselEndpoint}}/?q={"ve_peri":"{{gmlvesselName}}"}&limit=25'
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        const searchTerm = String(bru.getEnvVar("gmlvesselName") || "").trim();
        if (!searchTerm) {
          throw new Error("gmlvesselName must not be empty");
        }
    - type: after-response
      code: |-
        const body = res.getBody();
        const searchTerm = bru.getEnvVar("gmlvesselName").toLowerCase();

        if (!body || !Array.isArray(body.items)) {
          throw new Error("GMLVESSEL search did not return an ORDS collection");
        }

        const mismatch = body.items.find(
          (vessel) =>
            String(vessel.ve_peri || "").trim().toLowerCase() !== searchTerm.trim()
        );
        if (mismatch) {
          throw new Error(
            `GMLVESSEL returned a non-matching record: ${mismatch.ve_peri}`
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Searches for an exact ve_peri match.
  Change gmlvesselName in the selected environment to update the search term.
