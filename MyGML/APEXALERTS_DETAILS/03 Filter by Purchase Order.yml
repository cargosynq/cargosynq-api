info:
  name: Filter APEXALERTS_DETAILS by Purchase Order
  type: http
  seq: 3

http:
  method: GET
  url: '{{mygmlApexalertsDetailsEndpoint}}/?q={"ad_aforapo":{{apexalertsDetailsPurchaseOrderId}}}&limit=5'
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        const purchaseOrderId = String(
          bru.getEnvVar("apexalertsDetailsPurchaseOrderId") || ""
        ).trim();
        if (!/^\d+$/.test(purchaseOrderId)) {
          throw new Error(
            "apexalertsDetailsPurchaseOrderId must be a numeric po_sequ value"
          );
        }
    - type: after-response
      code: |-
        const body = res.getBody();
        const purchaseOrderId = String(
          bru.getEnvVar("apexalertsDetailsPurchaseOrderId")
        );

        if (!body || !Array.isArray(body.items)) {
          throw new Error(
            "APEXALERTS_DETAILS filter did not return an ORDS collection"
          );
        }

        const mismatch = body.items.find(
          (detail) => String(detail.ad_aforapo) !== purchaseOrderId
        );
        if (mismatch) {
          throw new Error(
            `Expected PO ${purchaseOrderId}, received ${mismatch.ad_aforapo}`
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns attachment details belonging to one purchase order by matching ad_aforapo.
  Set apexalertsDetailsPurchaseOrderId to the purchase order's po_sequ value.
