info:
  name: Filter GMLPACKS by Purchase Order
  type: http
  seq: 3

http:
  method: GET
  url: '{{mygmlGmlpacksEndpoint}}/?q={"pp_po_sequ":{{gmlpacksPurchaseOrderId}}}&limit=25'
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        const purchaseOrderId = String(
          bru.getEnvVar("gmlpacksPurchaseOrderId") || ""
        ).trim();
        if (!/^\d+$/.test(purchaseOrderId)) {
          throw new Error("gmlpacksPurchaseOrderId must be a numeric po_sequ value");
        }
    - type: after-response
      code: |-
        const body = res.getBody();
        const purchaseOrderId = String(
          bru.getEnvVar("gmlpacksPurchaseOrderId")
        );

        if (!body || !Array.isArray(body.items)) {
          throw new Error("GMLPACKS filter did not return an ORDS collection");
        }

        const mismatch = body.items.find(
          (pack) => String(pack.pp_po_sequ) !== purchaseOrderId
        );
        if (mismatch) {
          throw new Error(
            `Expected PO ${purchaseOrderId}, received ${mismatch.pp_po_sequ}`
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns packages belonging to one GMLPO record by matching pp_po_sequ.
  Set gmlpacksPurchaseOrderId to the purchase order's po_sequ value.
