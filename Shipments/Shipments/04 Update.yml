info:
  name: Update Shipments
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{shipmentsEndpoint}}/shipments/{{shipmentId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "status": "IN_TRANSIT",
        "actualdeparture": "2026-08-02"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /shipments/{id}
  Defined by the cq-backend Shipments module.
