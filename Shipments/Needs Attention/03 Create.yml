info:
  name: Create Needs Attention
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsendpoint}}/shipments_needsattentions"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "shipmentsid": {{shipmentId}},
        "organizationsid": {{organizationId}},
        "reason": "Missing document",
        "status": "ACTIVE",
        "code": "MISSING_DOCS"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipments_needsattentions
  Defined by the cq-backend Shipments module.
