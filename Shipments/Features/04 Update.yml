info:
  name: Update Features
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{shipmentsendpoint}}/shipments_features/{{shipmentFeatureId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "enabled": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /shipments_features/{id}
  Defined by the cq-backend Shipments module.
