info:
  name: Update Charges
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{shipmentsendpoint}}/shipments_charges/{{shipmentChargeId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "sellprice": "1300.00",
        "sellquantity": "1"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /shipments_charges/{id}
  Defined by the cq-backend Shipments module.
