info:
  name: Create Charges
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsendpoint}}/shipments_charges"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "shipmentsid": {{shipmentId}},
        "businessesid": {{businessId}},
        "placesid": {{placeId}},
        "chargetype": "freight",
        "chargecode": "OFT",
        "description": "Ocean Freight",
        "buycost": "1000.00",
        "buycurrency": "USD",
        "buyquantity": "1",
        "buyunit": "CONTAINER",
        "sellprice": "1200.00",
        "sellcurrency": "USD",
        "sellquantity": "1",
        "sellunit": "CONTAINER"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipments_charges
  Defined by the cq-backend Shipments module.
