info:
  name: Update Unit References
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{shipmentsEndpoint}}/shipments_units_references/{{shipmentUnitReferenceId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "referencevalue": "MSCU7654321"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /shipments_units_references/{id}
  Defined by the cq-backend Shipments module.
