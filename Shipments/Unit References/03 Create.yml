info:
  name: Create Unit References
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsendpoint}}/shipments_units_references"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "shipmentsunitsid": {{shipmentUnitId}},
        "referencetype": "CONTAINER",
        "referencevalue": "MSCU1234567"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipments_units_references
  Defined by the cq-backend Shipments module.
