info:
  name: Create Warehouse Receipts
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsEndpoint}}/warehouse_receipts"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "shipmentsunitsid": {{shipmentUnitId}},
        "placesid": {{placeId}},
        "inboundshipmentsid": {{shipmentId}},
        "status": "AVAILABLE",
        "receivedat": "2026-07-28T10:00:00.000Z"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /warehouse_receipts
  Defined by the cq-backend Shipments module.
