info:
  name: Create Actions
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsEndpoint}}/shipments_actions"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "organizationsid": {{organizationId}},
        "shipmentsid": {{shipmentId}},
        "entitytype": "shipments",
        "entityid": {{shipmentId}},
        "actiontype": "patch",
        "title": "Update shipment status",
        "proposedchanges": {
          "status": "DELIVERED"
        },
        "currentstate": {
          "status": "IN_TRANSIT"
        },
        "status": "CREATED"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipments_actions
  Defined by the cq-backend Shipments module.
