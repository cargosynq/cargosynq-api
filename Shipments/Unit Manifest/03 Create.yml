info:
  name: Create Unit Manifest
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsendpoint}}/shipments_units_manifest"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "shipmentsunitsid": {{shipmentUnitId}},
        "sourceunitid": {{sourceShipmentUnitId}},
        "quantity": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipments_units_manifest
  Defined by the cq-backend Shipments module.
