info:
  name: Create Remarks
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsEndpoint}}/shipments_remarks"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "shipmentsid": {{shipmentId}},
        "remark": "Please review this shipment",
        "mentions": [
          {
            "usersid": {{userId}}
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipments_remarks
  Defined by the cq-backend Shipments module.
