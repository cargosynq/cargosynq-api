info:
  name: Update Remarks
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{shipmentsendpoint}}/shipments_remarks/{{shipmentRemarkId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "remark": "Updated shipment remark"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /shipments_remarks/{id}
  Defined by the cq-backend Shipments module.
