info:
  name: Create Activities
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsendpoint}}/shipments_activities"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "shipmentsid": {{shipmentId}},
        "activitytype": "STATUS_CHANGE",
        "description": "Shipment entered transit",
        "metadata": {
          "status": "IN_TRANSIT"
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipments_activities
  Defined by the cq-backend Shipments module.
