info:
  name: Update Activities
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{shipmentsEndpoint}}/shipments_activities/{{shipmentActivityId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "description": "Updated activity description"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /shipments_activities/{id}
  Defined by the cq-backend Shipments module.
