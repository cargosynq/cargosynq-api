info:
  name: Create Remark Mentions
  type: http
  seq: 3

http:
  method: POST
  url: "{{shipmentsendpoint}}/shipments_remarks_mentions"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "remarksid": {{shipmentRemarkId}},
        "usersid": {{userId}}
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipments_remarks_mentions
  Defined by the cq-backend Shipments module.
