info:
  name: Create Warehouse Receipt Access
  type: http
  seq: 2

http:
  method: POST
  url: "{{shipmentsendpoint}}/warehouse_receipts_access"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "warehousereceiptsid": {{warehouseReceiptId}},
        "organizationsid": {{organizationId}},
        "accesstype": "SHARED"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /warehouse_receipts_access
  Defined by the cq-backend Shipments module.
