info:
  name: Track shipment
  type: http
  seq: 2

http:
  method: GET
  url: "{{supplementaryfunctionalitiesendpoint}}/track/{{trackingnumber}}/{{destinationcountry}}"

runtime:
  variables:
    - name: trackingnumber
      value: "1544501162"
    - name: destinationcountry
      value: IT

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves tracking details for a shipment using its tracking number and
  destination country code.
