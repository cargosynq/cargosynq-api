info:
  name: Get shipment attribute options
  type: http
  seq: 1

http:
  method: POST
  url: "{{supplementaryfunctionalitiesendpoint}}/shipment-attribute-options"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "unitIds": [{{shipmentUnitId}}]
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: shipmentUnitId
      value: "2311"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Loads supported references from the requested shipment units and returns distinct shipment options.
  PO/PO_NUMBER becomes shipmentNumber (using the existing SHP- prefix convention),
  AWB/TRACKING becomes tracking, and party/location references become their corresponding
  client, origin, destination, shipper, consignee, or carrier attributes.
  Related options may include the first trigram-matched business or place.
