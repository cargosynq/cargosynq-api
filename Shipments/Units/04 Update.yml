info:
  name: Update Units
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{shipmentsendpoint}}/shipments_units/{{shipmentUnitId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "weight": 15200,
        "description": "Updated container weight"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /shipments_units/{id}
  Defined by the cq-backend Shipments module.
