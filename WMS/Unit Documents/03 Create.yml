info:
  name: Create Unit Documents
  type: http
  seq: 3

http:
  method: POST
  url: "{{endpoint}}/wms_units_documents"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "wmsunitsid": {{unitId}},
        "originalfilename": "unit-photo.jpg",
        "storagebucket": "cargosynq-wms-receipts-documents-dev",
        "storagekey": "wms-units/{{unitId}}/unit-photo.jpg",
        "storageurl": "https://example.invalid/unit-photo.jpg",
        "size": 1024,
        "mimetype": "image/jpeg",
        "md5hash": "replace-with-md5-hash",
        "isdeleted": false,
        "documenttype": "PHOTO"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /wms_units_documents
  Defined by cq-backend and protected by the WMS Cognito authorizer.
