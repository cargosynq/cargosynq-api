info:
  name: Create Positions
  type: http
  seq: 3

http:
  method: POST
  url: "{{endpoint}}/wms_positions"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "placesid": {{placeId}},
        "code": "A-03-02",
        "description": "Aisle A, Rack 3, Shelf 2",
        "positiontype": "STORAGE",
        "isactive": true
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /wms_positions
  Defined by cq-backend and protected by the WMS Cognito authorizer.
