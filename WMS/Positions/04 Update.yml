info:
  name: Update Positions
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{endpoint}}/wms_positions/{{positionId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "description": "Updated position description",
        "isactive": true
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /wms_positions/{id}
  Defined by cq-backend and protected by the WMS Cognito authorizer.
