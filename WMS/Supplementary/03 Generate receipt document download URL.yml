info:
  name: Generate receipt document download URL
  type: http
  seq: 3

http:
  method: GET
  url: "{{supplementaryendpoint}}/wms-receipts/documents/presigned-url?receiptsDocumentId={{receiptsDocumentId}}"
  params:
    - name: receiptsDocumentId
      value: "{{receiptsDocumentId}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Generates a pre-signed S3 GET URL for an existing wms_receipts_documents record.
  The URL expires after 15 minutes.
