info:
  name: Get shipment attribute options
  type: http
  seq: 9

http:
  method: POST
  url: "{{supplementaryfunctionalitiesendpoint}}/shipment-attribute-options"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "unitIds": [{{unitId}}]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Loads AWB, GOODS_BUYER, and GOODS_SELLER references from the requested WMS units.
  Distinct values are mapped to tracking, client, and origin shipment attribute options.
  Client and origin options may include the first trigram-matched business or place.
