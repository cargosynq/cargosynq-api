info:
  name: Create Picklists
  type: http
  seq: 3

http:
  method: POST
  url: "{{endpoint}}/wms_picklists"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "placesid": {{placeId}},
        "status": "OPEN",
        "priority": "NORMAL",
        "assignedto": {{userId}},
        "notes": "Example picklist"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /wms_picklists
  Defined by cq-backend and protected by the WMS Cognito authorizer.
