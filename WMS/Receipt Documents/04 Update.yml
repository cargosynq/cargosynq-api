info:
  name: Update Receipt Documents
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{endpoint}}/wms_receipts_documents/{{receiptsDocumentId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "documenttype": "COMMERCIAL_INVOICE",
        "isdeleted": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /wms_receipts_documents/{id}
  Defined by cq-backend and protected by the WMS Cognito authorizer.
