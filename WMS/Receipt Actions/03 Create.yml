info:
  name: Create Receipt Actions
  type: http
  seq: 3

http:
  method: POST
  url: "{{endpoint}}/wms_receipts_actions"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "wmsreceiptsid": {{receiptId}},
        "entitytype": "wms_receipts",
        "entityid": {{receiptId}},
        "actiontype": "patch",
        "title": "Mark receipt as completed",
        "summary": "All units have been processed",
        "proposedchanges": {
          "status": "COMPLETED"
        },
        "currentstate": {
          "status": "PROCESSING"
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /wms_receipts_actions
  Defined by cq-backend and protected by the WMS Cognito authorizer.
