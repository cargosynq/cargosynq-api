info:
  name: Create Picklist Units
  type: http
  seq: 3

http:
  method: POST
  url: "{{endpoint}}/wms_picklists_units"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "wmspicklistsid": {{picklistId}},
        "wmsunitsid": {{unitId}},
        "status": "PENDING",
        "wmspositionsid": {{positionId}},
        "notes": "Example picklist unit"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /wms_picklists_units
  Defined by cq-backend and protected by the WMS Cognito authorizer.
