info:
  name: Update Picklist Units
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{endpoint}}/wms_picklists_units/{{picklistUnitId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "status": "PICKED",
        "pickedby": {{userId}}
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /wms_picklists_units/{id}
  Defined by cq-backend and protected by the WMS Cognito authorizer.
