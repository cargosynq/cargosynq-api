info:
  name: Apply Unit Actions
  type: http
  seq: 6

http:
  method: POST
  url: "{{endpoint}}/wms_units_actions/{{unitActionId}}/apply"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "applyStrategy": "merge"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /wms_units_actions/{id}/apply
  Defined by cq-backend and protected by the WMS Cognito authorizer.
