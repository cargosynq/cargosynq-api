info:
  name: Update Unit Actions
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{endpoint}}/wms_units_actions/{{unitActionId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "title": "Updated action title",
        "proposedchanges": {
          "conditionreceived": "DAMAGED"
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /wms_units_actions/{id}
  Defined by cq-backend and protected by the WMS Cognito authorizer.
