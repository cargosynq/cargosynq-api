info:
  name: Create Unit Actions
  type: http
  seq: 3

http:
  method: POST
  url: "{{endpoint}}/wms_units_actions"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "wmsunitsid": {{unitId}},
        "entitytype": "wms_units",
        "entityid": {{unitId}},
        "actiontype": "patch",
        "title": "Update unit condition",
        "summary": "Record the condition found during handling",
        "proposedchanges": {
          "conditionreceived": "DAMAGED"
        },
        "currentstate": {
          "conditionreceived": "GOOD"
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /wms_units_actions
  Defined by cq-backend and protected by the WMS Cognito authorizer.
