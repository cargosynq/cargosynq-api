info:
  name: Update Units
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{endpoint}}/wms_units/{{unitId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "length": 60,
        "width": 40,
        "height": 30,
        "dimensionunit": "cm",
        "weight": 12.5,
        "weightunit": "kg",
        "packagetype": "BOX",
        "conditionreceived": "GOOD",
        "isdg": false,
        "isbonded": false,
        "status": "IN_STOCK"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /wms_units/{id}
  Defined by cq-backend and protected by the WMS Cognito authorizer.
