info:
  name: Update Receipts
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{endpoint}}/wms_receipts/{{receiptId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-idempotency-key
      value: "{{idempotencyKey}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "status": "PROCESSING",
        "notes": "Receipt is being processed"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PATCH /wms_receipts/{id}
  Defined by cq-backend and protected by the WMS Cognito authorizer.
