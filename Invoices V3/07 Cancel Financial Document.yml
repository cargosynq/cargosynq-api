info: { name: Cancel Invoice, type: http, seq: 7 }
http:
  method: POST
  url: "{{invoicesv3endpoint}}/invoices/{{financialDocumentId}}/cancel"
  headers:
    - { name: x-idempotency-key, value: "{{$guid}}" }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Cancels an invoice and reverses reserved shipment-charge allocations.
