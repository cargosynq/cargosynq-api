info: { name: List Invoices, type: http, seq: 1 }
http:
  method: GET
  url: "{{invoicesv3endpoint}}/invoices"
  params:
    - { name: status, value: eq.APPROVED, type: query, disabled: true }
    - { name: documentNumber, value: search.WORLD, type: query, disabled: true }
    - { name: or, value: (status.eq.DRAFT,status.eq.APPROVED), type: query, disabled: true }
    - { name: order, value: documentNumber.rank.WORLD, type: query, disabled: true }
    - { name: limit, value: "20", type: query }
    - { name: offset, value: "0", type: query }
    - name: select
      value: id,documentNumber,status,client(*),lines(*),activities(*)
      type: query
      disabled: true
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: |-
  Lists AP and AR invoices for the authenticated organization.

  The response is a raw JSON array. Filters use the cq-backend grammar, for
  example `status=eq.APPROVED` and `documentNumber=search.WORLD`.

  Enable `select` to fetch the requested document relations in the same call.
  Nested `*` is supported for selectable relations. For AR invoices,
  `client(*)` resolves the live client from `invoiceRecipient.entityId`; it is
  null when the relation does not apply. Parents are paged before related data
  is batch-loaded.
