info: { name: Update Invoice, type: http, seq: 4 }
http:
  method: PATCH
  url: "{{invoicesv3endpoint}}/invoices/{{financialDocumentId}}"
  headers:
    - { name: Content-Type, value: application/json }
    - { name: x-idempotency-key, value: "{{$guid}}" }
  body:
    type: json
    data: |-
      {
        "documentNumber": "UPDATED-{{$timestamp}}",
        "dueDate": "2026-09-18",
        "invoiceRecipient": {
          "entityId": "{{invoiceRecipientEntityId}}",
          "snapshot": {
            "name": "Updated Invoice Recipient",
            "address": "Updated billing address",
            "taxId": "BE0000000000",
            "email": "accounts-payable@example.invalid"
          }
        },
        "clientId": "{{invoiceRecipientEntityId}}",
        "paymentTerms": "Payment due within 30 days",
        "notes": "Updated while the invoice is editable."
      }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: |-
  Partially updates a DRAFT or EXTRACTED invoice. Party snapshots, notes, and
  payment terms are editable until workflow immutability applies. To replace
  lines, send the complete lines array; each line may contain discountRate or
  discountAmount, but not both.
