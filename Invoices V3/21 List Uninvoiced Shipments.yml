info: { name: List Uninvoiced Shipments, type: http, seq: 21 }
http:
  method: GET
  url: "{{invoicesv3endpoint}}/uninvoiced-shipments?direction={{invoiceDirection}}"
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Returns organization-accessible shipments grouped into AP or AR currency coverage buckets, including contributing invoice links and closure state. Omit direction to return both sides.
