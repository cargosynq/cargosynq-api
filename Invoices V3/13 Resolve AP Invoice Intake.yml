info: { name: Resolve AP Invoice Intake, type: http, seq: 13 }
http:
  method: PATCH
  url: "{{invoicesv3endpoint}}/ap-invoice-intakes/{{apInvoiceIntakeId}}"
  headers:
    - { name: Content-Type, value: application/json }
    - { name: x-idempotency-key, value: "{{$guid}}" }
  body:
    type: json
    data: |-
      {
        "invoiceNumber": "AP-{{$timestamp}}",
        "invoiceDate": "2026-08-31",
        "dueDate": "2026-09-30",
        "currency": "EUR",
        "vendorName": "Resolved vendor name",
        "subtotal": "500.00",
        "taxTotal": "0.00",
        "total": "500.00",
        "vendorId": "{{businessId}}",
        "shipmentId": "{{shipmentId}}",
        "lines": [{
          "lineId": "{{apInvoiceIntakeLineId}}",
          "chargeCodeId": "{{chargeCodeId}}",
          "description": "Ocean freight",
          "quantity": "1",
          "unitOfMeasure": "EA",
          "unitPrice": "500.00",
          "netAmount": "500.00",
          "taxRate": "0",
          "taxAmount": "0.00",
          "grossAmount": "500.00"
        }]
      }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: |-
  Updates extracted invoice attributes, resolution IDs, and line attributes
  transactionally. Returns `202` with
  `messageId`, `resourceId`, and status `UPDATED`. The message ID is also the
  persisted `ap-invoice-intake.updated` event ID; retries must reuse the same
  `x-idempotency-key`.
