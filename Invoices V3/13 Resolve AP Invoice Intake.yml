info: { name: Resolve AP Invoice Intake, type: http, seq: 13 }
http:
  method: PATCH
  url: "{{invoicesv3endpoint}}/ap-invoice-intakes/{{apInvoiceIntakeId}}"
  headers:
    - { name: Content-Type, value: application/json }
    - { name: x-idempotency-key, value: "{{$guid}}" }
  body:
    type: json
    data: |-
      {
        "vendorId": "{{businessId}}",
        "shipmentId": "{{shipmentId}}",
        "lines": [{
          "lineId": "{{apInvoiceIntakeLineId}}",
          "chargeCodeId": "{{chargeCodeId}}",
          "description": "Ocean freight",
          "quantity": "1",
          "unitPrice": "500.00",
          "taxRate": "0"
        }]
      }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Resolves vendor, optional shipment, and extracted line mappings.
