info: { name: Finalize AP Invoice Intake, type: http, seq: 14 }
http:
  method: POST
  url: "{{invoicesv3endpoint}}/ap-invoice-intakes/{{apInvoiceIntakeId}}/finalize"
  headers:
    - { name: x-idempotency-key, value: "{{$guid}}" }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: |-
  Creates the EXTRACTED AP invoice after required intake fields are resolved.
  Returns HTTP 202 with messageId, the new document resourceId, and status
  FINALIZED. Event status progresses through PENDING to COMPLETED or FAILED.
