info: { name: Update Shipment Coverage Settings, type: http, seq: 23 }
http:
  method: PATCH
  url: "{{invoicesv3endpoint}}/shipment-coverage-settings"
  headers:
    - { name: Content-Type, value: application/json }
  body:
    type: json
    data: |-
      {
        "absoluteTolerance": "1.00",
        "percentageTolerance": "0.50"
      }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Updates absolute and percentage coverage tolerances. Either threshold accepts a variance; zero disables that threshold.
