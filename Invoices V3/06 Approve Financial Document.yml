info: { name: Approve Invoice, type: http, seq: 6 }
http:
  method: POST
  url: "{{invoicesv3endpoint}}/invoices/{{financialDocumentId}}/approve"
  headers:
    - { name: x-idempotency-key, value: "{{$guid}}" }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: |-
  Approves a PENDING_APPROVAL invoice. Returns HTTP 202 with messageId,
  resourceId, and status APPROVED. Event status progresses through PENDING to
  COMPLETED or FAILED.
