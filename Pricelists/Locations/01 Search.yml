info: { name: Search Locations, type: http, seq: 1 }
http:
  method: GET
  url: "{{pricelistsendpoint}}/api/unlocode-locations/search"
  params:
    - { name: search, value: Amsterdam, type: query }
    - { name: limit, value: "25", type: query }
    - { name: seaport, value: "true", type: query, disabled: true }
    - { name: airport, value: "true", type: query, disabled: true }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Text search across UN/LOCODE locations.
