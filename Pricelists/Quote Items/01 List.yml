info: { name: List Quote Items, type: http, seq: 1 }
http:
  method: GET
  url: "{{pricelistsendpoint}}/quoteitems"
  params:
    - { name: quote_id, value: "eq.{{quoteId}}", type: query }
    - { name: limit, value: "100", type: query }
    - { name: offset, value: "0", type: query }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Lists independently addressable lines for a quote.
