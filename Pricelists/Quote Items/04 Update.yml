info: { name: Update Quote Item, type: http, seq: 4 }
http:
  method: PATCH
  url: "{{pricelistsendpoint}}/quotes_items/{{quoteItemId}}"
  headers:
    - { name: Content-Type, value: application/json }
    - { name: x-idempotency-key, value: "{{idempotencyKey}}", disabled: true }
  body:
    type: json
    data: |-
      {
        "carrier": "SQ",
        "line_total_amount": 275,
        "currency": "EUR"
      }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Enqueues a partial line update and returns 202 with messageId; the worker atomically recalculates parent totals.
