info: { name: Create Quote Item, type: http, seq: 3 }
http:
  method: POST
  url: "{{pricelistsendpoint}}/quotes_items"
  headers:
    - { name: Content-Type, value: application/json }
    - { name: x-idempotency-key, value: "{{idempotencyKey}}", disabled: true }
  body:
    type: json
    data: |-
      {
        "quote_id": {{quoteId}},
        "line_no": 1,
        "origin": "AMS",
        "destination": "SIN",
        "modality": "air",
        "carrier": "KL",
        "weight_kg": 100,
        "selected_optional_components": {},
        "component_overrides": {},
        "priced_breakdown_snapshot": [],
        "line_total_amount": 250,
        "currency": "EUR",
        "input_snapshot": {},
        "option_snapshot": {},
        "raw_item": { "source": "bruno" }
      }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Enqueues line creation and returns 202 with messageId; the worker atomically recalculates parent totals.
