info: { name: Import Uploaded Rates, type: http, seq: 2 }
http:
  method: POST
  url: "{{pricelistsaiendpoint}}/upload-rates"
  params:
    - { name: template, value: air-standard, type: query }
  headers:
    - { name: Content-Type, value: application/json }
  body:
    type: json
    data: |-
      {
        "s3_key": "{{pricelistUploadS3Key}}"
      }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Imports a previously uploaded rate file. Template may be air-standard or air-last-mile.
