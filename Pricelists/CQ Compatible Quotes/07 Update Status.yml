info: { name: Update Quote Status, type: http, seq: 7 }
http:
  method: POST
  url: "{{pricelistsendpoint}}/quotes/{{quoteId}}/status"
  headers:
    - { name: Content-Type, value: application/json }
  body: { type: json, data: "{\n  \"status\": \"accepted\",\n  \"version\": 1\n}" }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Status must be draft, sent, accepted, rejected, or expired.
