info: { name: List Quotes, type: http, seq: 1 }
http:
  method: GET
  url: "{{pricelistsendpoint}}/quotes"
  headers:
    - { name: Accept, value: application/json }
  params:
    - { name: status, value: eq.draft, type: query, disabled: true }
    - { name: customer_company, value: "ilike.*cargo*", type: query, disabled: true }
    - { name: order, value: updated_at.desc, type: query }
    - { name: limit, value: "20", type: query }
    - { name: offset, value: "0", type: query }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Returns a raw array and supports CQ-style filter operators.
