info: { name: Update Quote, type: http, seq: 4 }
http:
  method: PATCH
  url: "{{pricelistsendpoint}}/quotes/{{quoteId}}"
  headers:
    - { name: Content-Type, value: application/json }
    - { name: x-idempotency-key, value: "{{idempotencyKey}}", disabled: true }
  body:
    type: json
    data: |-
      {
        "customer_company": "Updated Company",
        "discount": { "type": "percent", "value": 5 }
      }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Enqueues a parent-only partial update and returns 202 with messageId.
