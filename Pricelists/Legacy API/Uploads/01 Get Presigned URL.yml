info: { name: Get Upload Presigned URL, type: http, seq: 1 }
http:
  method: GET
  url: "{{pricelistsendpoint}}/api/upload-presigned-url"
  params:
    - { name: filename, value: rates.csv, type: query }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Creates a five-minute S3 upload URL and returns its s3_key.
