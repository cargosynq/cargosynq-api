info: { name: Get Quote, type: http, seq: 2 }
http:
  method: GET
  url: "{{pricelistsendpoint}}/quotes/{{quoteId}}"
  params:
    - { name: select, value: "*,quotes_items(*),quotes_activities(*),quotes_history(*)", type: query }
  auth: { type: bearer, token: "{{token}}" }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: Gets a quote with requested relations. Requested relations are always arrays.
