info: { name: Delete Topic, type: http, seq: 5 }
http:
  method: POST
  url: "{{agentGraphqlEndpoint}}"
  headers: [{ name: Content-Type, value: application/json }]
  auth: { type: bearer, token: "{{token}}" }
  body:
    type: json
    data: |-
      {
        "query": "mutation DeleteTopic($topicid: String!) { deleteTopic(topicid: $topicid) { topicid userid title createdat lastmessageat pinned } }",
        "variables": { "topicid": "{{agentTopicId}}" }
      }
settings: { encodeUrl: true, timeout: 0, followRedirects: true, maxRedirects: 5 }
docs: |-
  Permanently deletes the authenticated user's topic, its messages, and its
  AgentTable attachment-status records.
  Jira: https://cargosynq.atlassian.net/browse/SCRUM-859
