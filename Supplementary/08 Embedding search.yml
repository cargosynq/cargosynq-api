http:
  method: GET
  url: "{{supplementaryfunctionalitiesendpoint}}/embeddings/{{embeddingModel}}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /embeddings/{model}
  Searches embeddings using the specified model.
