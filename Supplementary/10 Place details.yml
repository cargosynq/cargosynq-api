info:
  name: Place details
  type: http
  seq: 10

http:
  method: GET
  url: "{{supplementaryfunctionalitiesendpoint}}/places/details"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /places/details
  Proxies a Google Place Details request for a specific place.
