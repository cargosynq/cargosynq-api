info:
  name: Shipment upload presigned URL
  type: http
  seq: 16

http:
  method: POST
  url: "{{supplementaryfunctionalitiesendpoint}}/shipment-upload/presigned-url"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "shipmentId": {{shipmentId}},
        "fileName": "document.pdf",
        "contentType": "application/pdf"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipment-upload/presigned-url
  Generates a presigned URL for uploading a document to a shipment.
