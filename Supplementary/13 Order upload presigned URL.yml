info:
  name: Order upload presigned URL
  type: http
  seq: 13

http:
  method: POST
  url: "{{supplementaryfunctionalitiesendpoint}}/order-upload/presigned-url"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "orderId": {{orderId}},
        "fileName": "document.pdf",
        "contentType": "application/pdf"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /order-upload/presigned-url
  Generates a presigned URL for uploading a document to an order.
