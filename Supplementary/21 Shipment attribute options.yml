info:
  name: Shipment attribute options
  type: http
  seq: 21

http:
  method: POST
  url: "{{supplementaryfunctionalitiesendpoint}}/shipment-attribute-options"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "unitIds": [{{shipmentUnitId}}]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /shipment-attribute-options
  Loads supported references from the requested shipment units and returns
  distinct shipment options. PO/PO_NUMBER becomes shipmentNumber (using the
  existing SHP- prefix convention), AWB/TRACKING becomes tracking, and
  party/location references become their corresponding client, origin,
  destination, shipper, consignee, or carrier attributes. Related options may
  include the first trigram-matched business or place with id and name.
