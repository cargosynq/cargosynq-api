info:
  name: Send email
  type: http
  seq: 3

http:
  method: POST
  url: "{{supplementaryfunctionalitiesendpoint}}/send-email"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "to": "recipient@example.com",
        "cc": "cc@example.com",
        "subject": "Follow-up regarding your order",
        "bodyText": "Hello, this is a follow-up email.",
        "bodyHtml": "<p>Hello, this is a follow-up email.</p>",
        "csid": "00000000-0000-0000-0000-000000000000",
        "in-reply-to": "",
        "references": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /send-email
  Sends an email via SES. The body can be constructed manually or by passing
  the output of POST /compose-follow-up-email directly.
