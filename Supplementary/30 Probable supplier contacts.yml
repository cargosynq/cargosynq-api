info:
  name: Probable supplier contacts
  type: http
  seq: 30

http:
  method: GET
  url: "{{supplementaryfunctionalitiesendpoint}}/orders/{{orderId}}/probable-contacts"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /orders/{orderId}/probable-contacts
  Returns probable supplier contacts found in the order's email communications.
  The endpoint verifies order access, excludes email addresses already registered
  as contacts for the GOODS_SELLER, and ranks the remaining addresses by how
  closely their domain matches the supplier's company name.
