info:
  name: Charge taxonomy
  type: http
  seq: 25

http:
  method: GET
  url: "{{supplementaryfunctionalitiesendpoint}}/charge-taxonomy"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /charge-taxonomy
  Returns the active canonical CargoSynq charge catalog.
  Optional query parameters: service_group, category, and search.
